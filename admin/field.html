<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Nova Shield — Field Console</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/field-load.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 128'%3E%3Cpath d='M50 4L94 22V64Q94 96 50 124Q6 96 6 64V22Z' fill='%230f2a33' stroke='%235aa8c4' stroke-width='7'/%3E%3C/svg%3E">
<style>
  /* The desktop field tool assumes room to spare; a driveway does not.
     This page is the same admin.css components (card, btn, check, field)
     in a strict single column, with larger tap targets and no reliance on
     hover for anything -- everything that matters is one thumb-tap away. */
  body { margin: 0; }
  .field-topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    /* Wraps instead of overflowing. With a queue badge ("Offline — 11 saved
       here"), Sync Now and Sign out all visible, the row measured 452px
       against a 390px viewport and gave the whole page a horizontal scroll --
       exactly when a tech is offline in a driveway, which is the situation
       this console exists for. */
    flex-wrap: wrap;
    gap: 10px; padding: 12px 16px;
    /* A sticky element sticks to the viewport edge once scrolled, past
       whatever safe-area padding body itself has -- same reasoning as
       .topbar in admin.css, same fix: the inset lives on the sticky
       element's own padding, not just a page-level one. */
    padding-top: max(12px, env(safe-area-inset-top));
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .field-topbar__brand { font-weight: 800; color: var(--text); text-decoration: none; }
  .field-topbar__brand em { font-style: normal; font-weight: 500; color: var(--muted); font-size: .82rem; }
  .field-view {
    padding: 14px 14px max(64px, calc(16px + env(safe-area-inset-bottom)));
    max-width: 560px; margin: 0 auto;
  }
  .field-view .card { margin-bottom: 14px; }
  .field-view .btn { min-height: 48px; font-size: 1rem; }
  .field-view .btn--sm { min-height: 40px; }
  .visit-card { display: block; text-decoration: none; color: inherit; }
  .visit-card .card { transition: none; }
  .visit-card:active .card { background: var(--surface-2); }
  .visit-card__time { font-weight: 800; color: var(--accent); }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .photo-grid__tile {
    position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .photo-grid__tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-grid__tag {
    position: absolute; left: 4px; bottom: 4px; font-size: .68rem; font-weight: 700;
    padding: 2px 6px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff;
  }
  /* Online [green] / Offline Queue: N actions [yellow] -- see offline-queue.js. */
  .sync-badge {
    font-size: .74rem; font-weight: 700; padding: 5px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .sync-badge--ok     { background: var(--ok-soft); color: var(--ok); }
  .sync-badge--queued { background: var(--gold-soft); color: var(--gold); }
  /* Sync failed is its own state: it used to look identical to "pending",
     so a stuck queue read as a queue that was merely waiting. */
  .sync-badge--error  { background: var(--danger-soft); color: var(--danger); }
</style>
</head>
<body>

<header class="field-topbar">
  <a class="field-topbar__brand" href="#/">Nova&nbsp;Shield <em>Field</em></a>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <a class="btn btn--sm" href="#/load">Vehicle load</a>
    <button class="btn btn--sm" id="syncNow" hidden>Sync Now</button>
    <span class="sync-badge sync-badge--ok" id="syncBadge">Online</span>
    <button class="btn btn--sm" id="signOut">Sign out</button>
  </div>
</header>

<main id="view" class="field-view" aria-live="polite">
  <div class="loading">Loading…</div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/bootstrap.js" onerror="window.nsStartupLoaderFailed = true; document.querySelector('.field-topbar')?.setAttribute('hidden', ''); document.getElementById('view').innerHTML = '&lt;section role=&quot;alert&quot; class=&quot;card&quot;&gt;&lt;h1&gt;An app file could not load&lt;/h1&gt;&lt;p&gt;Retry leaves previously saved outbox actions in place.&lt;/p&gt;&lt;button class=&quot;btn&quot; onclick=&quot;location.reload()&quot;&gt;Retry startup&lt;/button&gt;&lt;/section&gt;';"></script>
<script type="module" src="js/field.js"></script>
</body>
</html>
