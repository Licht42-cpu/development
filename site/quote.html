<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Quote | Nova Shield</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 128'%3E%3Cpath d='M50 4L94 22V64Q94 96 50 124Q6 96 6 64V22Z' fill='%23071a2b' stroke='%23c9d3d8' stroke-width='7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
  /* A quote is a document, not a landing page: light, printable, plain. */
  body { background: #f4f2ec; color: #16211f; }
  .doc { width: min(820px, calc(100% - 32px)); margin: 40px auto 80px; }
  .sheet { background: #fff; border: 1px solid #ddd8cc; border-radius: 14px;
           padding: clamp(24px, 5vw, 52px); box-shadow: 0 20px 60px rgba(0,0,0,.07); }
  .sheet-head { display: flex; justify-content: space-between; gap: 24px;
                flex-wrap: wrap; align-items: flex-start;
                border-bottom: 1px solid #e6e1d6; padding-bottom: 24px; }
  /* A flex item defaults to min-width:auto, so it refuses to shrink below
     its content's min-content width. The company email is one unbreakable
     token, so at 390px it pushed this document to 463px -- the address ran
     off the edge of the sheet and the whole page scrolled sideways. Same
     class of bug, and same fix, as .page-head p in admin.css: let the items
     shrink, and let a long address break mid-token when it has to. */
  .sheet-head > div { min-width: 0; }
  .sheet-head p, .parties p { overflow-wrap: anywhere; }
  /* Same master as site.css .brandart--lockup, so the quote and the website
     carry identical artwork. Letterhead scale keeps print ink sensible. */
  .qlockup { display:block; width:232px; aspect-ratio:2000/667;
    background:url('assets/brand/nova-shield-logo.png') no-repeat;
    background-size:contain; background-position:center;
    border-radius:2px; }
  @media print { .qlockup { width:200px; } }
  .meta { text-align: right; font-size: .84rem; color: #6c7772; }
  .meta strong { display: block; color: #16211f; font-size: 1rem; }
  .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 28px 0; }
  .parties h2 { font-family: var(--sans); font-size: .7rem; letter-spacing: .14em;
                text-transform: uppercase; color: #8a948f; margin: 0 0 6px; }
  .parties p { margin: 0; font-size: .95rem; }
  .lines { margin-top: 12px; }
  .line { display: flex; justify-content: space-between; gap: 16px;
          padding: 14px 0; border-bottom: 1px solid #efeade; }
  .line span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .line--credit span:last-child { color: #1f6b46; }
  .line--total { border-top: 2px solid #16211f; border-bottom: 0;
                 font-size: 1.25rem; font-weight: 800; padding-top: 16px; }
  .notes { margin-top: 28px; padding-top: 22px; border-top: 1px solid #e6e1d6;
           font-size: .88rem; color: #5f6a65; }
  .notes h3 { font-family: var(--sans); font-size: .7rem; letter-spacing: .14em;
              text-transform: uppercase; color: #8a948f; margin: 0 0 6px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; justify-content: center;
         min-height: 46px; padding: 12px 22px; border-radius: 999px; font-weight: 700;
         border: 1px solid #c9c3b4; background: #fff; color: #16211f; cursor: pointer;
         font: inherit; font-weight: 700; }
  .btn--accept { background: #16211f; color: #fff; border-color: #16211f; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .state { padding: 14px 16px; border-radius: 10px; font-size: .9rem; margin-top: 20px; }
  .state--ok { background: #e9f5ee; color: #1f6b46; }
  .state--warn { background: #fdf4e3; color: #8a6414; }
  .center { text-align: center; padding: 80px 20px; color: #6c7772; }
  @media print {
    @page { size: A4 portrait; margin: 12mm 15mm 12mm 15mm; }
    html, body { background: #fff; }
    body { color: #16211f; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* .doc's screen margins/width exist to center the card on a browser tab;
       on paper the @page margin already does that job, and leaving them in
       adds blank vertical space that can push the sheet onto a lonely extra
       page for a short quote. */
    .doc { width: auto; margin: 0; }
    .sheet { box-shadow: none; border: 0; padding: 0; }
    /* UI stripping: nothing interactive -- nav, accept/decline, the
       print-trigger button itself -- belongs on paper. */
    .actions, .no-print { display: none !important; }
    /* Keep each unit intact across a page boundary rather than splitting a
       line item, a heading from its value, or the final total from its
       label -- the usual causes of a quote reading as "cut off". Covers the
       header card, every line-item/adjustment/total row, and the notes and
       terms blocks. */
    .sheet-head, .parties, .parties > div, .line, .notes, .state {
      break-inside: avoid; page-break-inside: avoid;
    }
    .parties h2, .notes h3 { break-after: avoid; page-break-after: avoid; }
    /* This document lists line items as rows, not a multi-column ledger, so
       there is no per-column header to repeat across a page break -- each
       row already carries its own description and amount. The rule is kept
       for the day a literal <thead> is introduced here. */
    thead { display: table-header-group; }
  }
</style>

<meta name="description" content="Your Nova Shield quote.">
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<div class="doc" id="doc">
  <div class="center">Loading your quote…</div>
</div>
<script type="module" src="js/pages/quote.js"></script>
</body>
</html>
